<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA fallback: redirect all 404s to root for client-side routing
    (function () {
      var l = window.location;
      var path = l.pathname + l.search + l.hash;
      // Avoid double slash: '/#' + '/foo' => '/#/foo' (not '/#//foo')
      window.location.replace('/#' + path);
    })();
  </script>
</head>
<body>
  <noscript>JavaScript is required. Please enable JavaScript.</noscript>
</body>
</html>
