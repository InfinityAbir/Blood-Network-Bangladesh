<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA fallback: redirect all 404s to root for client-side routing
    var path = window.location.pathname;
    window.location.replace('/#' + path);
  </script>
</head>
<body>
  <noscript>JavaScript is required. Please enable JavaScript.</noscript>
</body>
</html>
