services:
  - type: web
    name: blood-network-api
    runtime: image
    image:
      url: ghcr.io/infinityabir/blood-network-bangladesh:main
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: blood-network-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: BloodNetworkBangladesh
      - key: Jwt__Audience
        value: BloodNetworkBangladesh
      - key: Jwt__ExpirationInMinutes
        value: 60
      - key: AllowedOrigins
        fromService:
          name: blood-network-frontend
          property: url
      - key: Serilog__WriteTo__0__Args__path
        value: /tmp/logs/bloodnetwork-.log
    healthCheckPath: /health

  - type: static_site
    name: blood-network-frontend
    buildCommand: |
      cd frontend/blood-network-web
      npm install
      npm run build -- --configuration=production
    staticPublishPath: ./frontend/blood-network-web/dist/blood-network-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          name: blood-network-api
          property: url

databases:
  - name: blood-network-db
    plan: free
    databaseName: bloodnetwork
    postgresMajorVersion: "16"
