databases:
  - name: blood-network-db
    plan: free
    databaseName: bloodnetwork
    postgresMajorVersion: "16"

# The API service is IaC-managed here (instead of the old manual dashboard setup) so
# instance count and the JWT signing secret are pinned and can't drift. See DEPLOY.md
# "Database backups" / "JWT secret" sections for why this matters.
#
# The frontend static site is still created manually per DEPLOY.md step 3 (its
# pre-deploy env.js generation trick doesn't map cleanly onto the Blueprint schema);
# only the API needs to be pinned to stop the 401 "signature key not found" issue.
services:
  - type: web
    name: blood-network-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: blood-network-db
          property: connectionString
      # Generated ONCE by Render on first Blueprint sync, then persisted across every
      # redeploy/rescale. Never click "Generate" or re-enter this manually afterwards —
      # doing so is what causes existing tokens to start failing signature validation.
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: BloodNetworkBangladesh
      - key: Jwt__Audience
        value: BloodNetworkBangladesh
      - key: Jwt__ExpirationInMinutes
        value: "60"
      # Refresh tokens rotate on every use, so an app opened even occasionally keeps
      # extending its own window — this is the idle timeout before a real re-login.
      # 7 days meant a user who didn't open the app for a week got signed out.
      - key: Jwt__RefreshExpirationInDays
        value: "90"
      - key: AllowedOrigins
        value: '["https://blood-network-bangladesh-frontend.onrender.com"]'
      # Secrets kept out of git: set once in the Render dashboard after first sync,
      # `sync: false` tells Render to leave the value alone on future blueprint syncs.
      - key: GroqApi__ApiKey
        sync: false
      # Firebase Admin service-account JSON (single-line/minified), from Firebase Console ->
      # Project Settings -> Service Accounts -> Generate new private key. Without this,
      # PushNotificationService silently no-ops and no OS-level push is ever sent (in-app
      # notifications via SignalR still work). See DEPLOY.md.
      - key: Firebase__ServiceAccountJson
        sync: false
